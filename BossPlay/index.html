<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BossPlay">
<title>BossPlay</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="bp-icone-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="bp-icone-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="back" class="icon" aria-label="Retour" hidden>‹</button>
    <div class="brand"><img class="logo" src="logo.png" alt="BossPlay"><span>BossPlay</span></div>
    <input id="search" type="search" placeholder="Rechercher" autocomplete="off">
    <button id="mic" class="icon" aria-label="Commande vocale" title="Commande vocale"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg></button>
    <button id="tvsearch" class="icon" aria-label="Chercher sur la télé" title="Chercher sur la télé"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8 20h8"/><circle cx="11.3" cy="10" r="2.4"/><path d="M13.1 11.8l2.1 2.1"/></svg></button>
    <button id="remote" class="icon" aria-label="Mes appareils" title="Mes appareils"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="13" height="9.5" rx="1.6"/><path d="M6.5 17h5"/><rect x="15.5" y="9" width="5.5" height="11" rx="1.4"/><path d="M17.8 17.4h.9"/></svg></button>
    <button id="who" class="pill" hidden></button>
    <button id="theme" class="icon" aria-label="Thème jour/nuit">◐</button>
  </header>
  <div id="banner" hidden></div>
  <nav id="tabs">
    <button data-tab="albums" class="on">Albums</button>
    <button data-tab="artists">Artistes</button>
    <button data-tab="songs">Chansons</button>
    <button data-tab="favs">Favoris</button>
    <button data-tab="playlists">Playlists</button>
    <button data-tab="kept">Ma musique téléchargée</button>
    <button data-tab="radio">Radio</button>
    <button data-tab="wishes">Envies</button>
    <button data-tab="stats">Écoutes</button>
    <button data-tab="settings">Réglages</button>
  </nav>
  <div id="else" hidden>
    <div class="art"></div>
    <div class="meta"><div class="t"></div><div class="s"></div></div>
    <button class="icon pp" aria-label="Mettre en pause sur l'autre appareil">⏸</button>
    <button class="pill take">Continuer ici</button>
    <div class="bar"><div class="fill"></div></div>
  </div>
  <main id="view"></main>
  <div id="mini" hidden>
    <div class="bar"><div class="fill"></div></div>
    <div class="row">
      <div class="art"></div>
      <div class="meta"><div class="t"></div><div class="s"></div></div>
      <button class="icon rwish" style="display:none" aria-label="Retenir ce titre">♥</button>
      <button class="icon tb skip prev" aria-label="Précédent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5.6v12.8c0 .8-.9 1.3-1.5.8L9.6 12.8a1 1 0 0 1 0-1.6l8.9-6.4c.6-.5 1.5 0 1.5.8z"/></svg></button>
      <button class="icon tb pp play big" aria-label="Lecture"></button>
      <button class="icon tb skip next" aria-label="Suivant"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5.6v12.8c0 .8.9 1.3 1.5.8l8.9-6.4a1 1 0 0 0 0-1.6L5.5 4.8C4.9 4.3 4 4.8 4 5.6z"/></svg></button>
      <button class="icon stop" style="display:none" aria-label="Arrêter la radio">⏹</button>
    </div>
  </div>
</div>

<section id="full" hidden>
  <div class="bg"></div>
  <button class="icon close" aria-label="Fermer">⌄</button>
  <div class="wrap">
    <div class="left"><div class="cover"></div><div class="lyrics" hidden></div></div>
    <div class="right">
      <div class="title"></div>
      <div class="artist link"></div>
      <div class="album link"></div>
      <div class="badges"></div>
      <input class="seek" type="range" min="0" max="1000" value="0">
      <div class="times"><span class="cur">0:00</span><span class="dur">0:00</span></div>
      <div class="controls">
        <button class="icon tb mode shuffle" aria-label="Aléatoire"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.8l2.4 4.4C14.3 16 15.5 17 17.5 17H21M17.5 4 21 7l-3.5 3M17.5 14 21 17l-3.5 3M3 17h3.5c1.3 0 2.2-.4 3-1.2M21 7h-3.5c-1.3 0-2.2.4-3 1.2"/></svg></button>
        <button class="icon tb skip prev" aria-label="Précédent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5.6v12.8c0 .8-.9 1.3-1.5.8L9.6 12.8a1 1 0 0 1 0-1.6l8.9-6.4c.6-.5 1.5 0 1.5.8z"/></svg></button>
        <button class="icon tb pp play huge" aria-label="Lecture"></button>
        <button class="icon tb skip next" aria-label="Suivant"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5.6v12.8c0 .8.9 1.3 1.5.8l8.9-6.4a1 1 0 0 0 0-1.6L5.5 4.8C4.9 4.3 4 4.8 4 5.6z"/></svg></button>
        <button class="icon tb mode repeat" aria-label="Répéter"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"/></svg></button>
      </div>
      <div class="actions">
        <button class="ib lyr" aria-label="Paroles"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5V17.5H4A1.5 1.5 0 0 1 2.5 16V7A1.5 1.5 0 0 1 4 5.5z"/><path d="M7.5 10.5h9M7.5 13.5h6"/></svg></button>
        <button class="ib clip" aria-label="Clip"><svg class="clipico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="4" fill="none" stroke="#fff" stroke-width="1.8"/><path class="tri" d="M10 9.2v5.6c0 .5.5.8.9.5l4.3-2.8a.6.6 0 0 0 0-1L10.9 8.7c-.4-.3-.9 0-.9.5z"/></svg></button>
        <button class="ib fav" aria-label="Favori"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="heart" d="M12 20.5s-7.5-4.6-9.3-9.4C1.6 8 3.6 4.5 7.1 4.5c2 0 3.6 1.1 4.9 2.9 1.3-1.8 2.9-2.9 4.9-2.9 3.5 0 5.5 3.5 4.4 6.6-1.8 4.8-9.3 9.4-9.3 9.4z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
        <button class="ib best" aria-label="Now Best"></button>
        <button class="ib kara" aria-label="Karaoké"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></button>
        <button class="ib sleep" aria-label="Minuteur"></button>
        <button class="ib more" aria-label="Plus"><svg viewBox="0 0 24 24" aria-hidden="true" fill="#fff"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
        <button class="pill rwish" style="display:none">♥ Retenir ce titre</button>
        <button class="pill rstop" style="display:none">⏹ Arrêter la radio</button>
      </div>
      <div class="err"></div>
    </div>
  </div>
</section>

<section id="clip" hidden>
  <div class="stage">
    <div class="side" hidden></div>
    <div class="video"><div id="yt"></div><div class="nov" hidden></div><div class="subs" hidden></div></div>
  </div>
  <button class="icon close" aria-label="Quitter le clip">✕</button>
  <div class="cbar">
    <input class="seek" type="range" min="0" max="1000" value="0">
    <div class="crow">
      <div class="info"><div class="t"></div><div class="s"></div></div>
      <button class="icon tb skip prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5.6v12.8c0 .8-.9 1.3-1.5.8L9.6 12.8a1 1 0 0 1 0-1.6l8.9-6.4c.6-.5 1.5 0 1.5.8z"/></svg></button>
      <button class="icon tb pp play big"></button>
      <button class="icon tb skip next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5.6v12.8c0 .8.9 1.3 1.5.8l8.9-6.4a1 1 0 0 0 0-1.6L5.5 4.8C4.9 4.3 4 4.8 4 5.6z"/></svg></button>
      <div class="tools">
        <button class="pill off minus">−0,5 s</button>
        <button class="pill off plus">+0,5 s</button>
        <button class="pill lmode">Sous-titres</button>
        <button class="pill src">Source ▾</button>
      </div>
    </div>
  </div>
</section>

<div id="sheet" hidden><div class="panel"></div></div>
<div id="toast" hidden></div>
<input id="files" type="file" accept="audio/*" multiple hidden>

<script src="app.js"></script>
</body>
</html>
